name: Build and deploy GATES wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TiddlyWiki
        run: npm install -g tiddlywiki

      - name: Show TiddlyWiki version (diagnostic)
        run: tiddlywiki --version

      - name: Prepare output directory
        run: mkdir -p static

      - name: Build static export
        run: tiddlywiki . --rendertiddler '$:/core/save/all' static/index.html text/plain

      - name: Verify output exists
        run: |
          if [ ! -s static/index.html ]; then
            echo "::error::static/index.html was not created or is empty. Check the 'Build static export' step's output above for TiddlyWiki warnings/errors."
            ls -la static/ || true
            exit 1
          fi
          echo "Build output looks good:"
          ls -la static/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4