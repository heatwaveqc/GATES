name: Build and deploy GATES wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TiddlyWiki
        run: npm install -g tiddlywiki

      - name: Show TiddlyWiki version
        run: tiddlywiki --version

      - name: Validate classified metadata
        run: node scripts/validate-metadata.js

      - name: Prepare output directory
        run: |
          rm -rf static
          mkdir -p static

      - name: Build Player wiki
        run: tiddlywiki . --build player

      - name: Build GM wiki
        run: tiddlywiki . --build gm

      - name: Publish Player wiki at site root
        run: cp static/player/index.html static/index.html

      - name: Verify audience builds
        run: |
          test -s static/index.html
          test -s static/player/index.html
          test -s static/gm/index.html

          grep -q "Player-facing GATES wiki foundation." static/player/index.html
          grep -q "Player-facing GATES wiki foundation." static/gm/index.html

          if grep -q "GM-only GATES wiki foundation." static/player/index.html; then
            echo "::error::GM-only material leaked into the Player build."
            exit 1
          fi

          grep -q "GM-only GATES wiki foundation." static/gm/index.html

          if grep -q "GATES Master Design Document" static/player/index.html; then
            echo "::error::Unclassified legacy material leaked into the Player build."
            exit 1
          fi

          echo "Audience builds verified:"
          ls -lh static/index.html static/player/index.html static/gm/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
